name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install polar
        run: |
          POLAR_VERSION="$(sed -n 's/^polar *= *"\(.*\)"/\1/p' polar.toml)"
          test -n "$POLAR_VERSION"
          export POLAR_VERSION
          curl -fsSL https://polar-lang.vercel.app/install.sh | sh
          echo "$HOME/.polar/bin" >> "$GITHUB_PATH"
      - run: polar --version
      - run: scripts/test.sh
